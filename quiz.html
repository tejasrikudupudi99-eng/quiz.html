/* =====================================================
   VARIABLES
===================================================== */

let currentPaper = [];
let currentQuestion = 0;
let studentName = "";
let score = 0;

let userAnswers = [];

let answeredQuestions = [];


/* =====================================================
   PAGE CONTROL
===================================================== */

function showPage(pageId) {

    document.querySelectorAll(".page").forEach(page => {
        page.classList.remove("active-page");
    });

    document.getElementById(pageId).classList.add("active-page");

    window.scrollTo(0, 0);
}


/* =====================================================
   STUDENT LOGIN
===================================================== */

function startStudentExam() {

    const name =
        document.getElementById("studentName").value.trim();

    if (name === "") {

        alert("Please enter student name.");

        return;
    }

    studentName = name;

    const selectedPaper =
        document.getElementById("paperSelect").value;

    currentPaper = quizData[selectedPaper];

    currentQuestion = 0;

    score = 0;

    userAnswers = new Array(currentPaper.length).fill(null);

    answeredQuestions =
        new Array(currentPaper.length).fill(false);

    document.getElementById("studentDisplay").innerText =
        "Student: " + studentName;

    createQuestionNumbers();

    showPage("quizPage");

    displayQuestion();
}


/* =====================================================
   CREATE QUESTION NUMBERS
===================================================== */

function createQuestionNumbers() {

    const container =
        document.getElementById("questionNumbers");

    container.innerHTML = "";

    currentPaper.forEach((question, index) => {

        const button =
            document.createElement("button");

        button.className =
            "btn btn-outline-primary question-number";

        button.innerText = index + 1;

        button.onclick = function () {

            currentQuestion = index;

            displayQuestion();
        };

        button.id = "questionNumber-" + index;

        container.appendChild(button);

    });
}


/* =====================================================
   DISPLAY QUESTION
===================================================== */

function displayQuestion() {

    const question =
        currentPaper[currentQuestion];

    document.getElementById("questionText").innerText =
        (currentQuestion + 1) +
        ". " +
        question.question;

    document.getElementById("questionCount").innerText =
        "Question " +
        (currentQuestion + 1) +
        " / " +
        currentPaper.length;


    const container =
        document.getElementById("optionsContainer");

    container.innerHTML = "";

    question.options.forEach((option, index) => {

        const button =
            document.createElement("button");

        button.className =
            "option-btn";

        button.innerText =
            String.fromCharCode(65 + index) +
            ". " +
            option;

        button.onclick = function () {

            selectAnswer(index);
        };


        if (userAnswers[currentQuestion] !== null) {

            button.disabled = true;

            if (index === question.answer) {

                button.classList.add("correct");

            }

            if (
                index === userAnswers[currentQuestion] &&
                index !== question.answer
            ) {

                button.classList.add("wrong");

            }

        }

        container.appendChild(button);

    });


    showFeedback();

    updateQuestionNumbers();


    if (currentQuestion === currentPaper.length - 1) {

        document.getElementById("nextButton").innerText =
            "Finish Exam ✓";

    } else {

        document.getElementById("nextButton").innerText =
            "Next →";
    }
}


/* =====================================================
   SELECT ANSWER
===================================================== */

function selectAnswer(selectedIndex) {

    if (userAnswers[currentQuestion] !== null) {

        return;
    }

    const question =
        currentPaper[currentQuestion];

    userAnswers[currentQuestion] =
        selectedIndex;

    answeredQuestions[currentQuestion] =
        true;

    if (selectedIndex === question.answer) {

        score++;

    }

    displayQuestion();
}


/* =====================================================
   FEEDBACK
===================================================== */

function showFeedback() {

    const feedback =
        document.getElementById("answerFeedback");

    if (userAnswers[currentQuestion] === null) {

        feedback.innerHTML = "";

        return;
    }

    const question =
        currentPaper[currentQuestion];

    const selected =
        userAnswers[currentQuestion];


    if (selected === question.answer) {

        feedback.innerHTML =
            '<div class="alert alert-success">' +
            "✅ Correct Answer!" +
            "</div>";

    } else {

        feedback.innerHTML =
            '<div class="alert alert-danger">' +
            "❌ Wrong Answer!<br>" +
            "<strong>Correct Answer:</strong> " +
            question.options[question.answer] +
            "</div>";
    }
}


/* =====================================================
   QUESTION NUMBERS UPDATE
===================================================== */

function updateQuestionNumbers() {

    currentPaper.forEach((question, index) => {

        const button =
            document.getElementById(
                "questionNumber-" + index
            );

        button.classList.remove(
            "answered",
            "current"
        );

        if (answeredQuestions[index]) {

            button.classList.add("answered");

        }

        if (index === currentQuestion) {

            button.classList.add("current");

        }

    });
}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    if (
        currentQuestion === currentPaper.length - 1
    ) {

        finishExam();

        return;
    }

    currentQuestion++;

    displayQuestion();
}


/* =====================================================
   PREVIOUS QUESTION
===================================================== */

function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        displayQuestion();
    }
}


/* =====================================================
   FINISH EXAM
===================================================== */

function finishExam() {

    showPage("resultPage");

    document.getElementById("resultStudent").innerText =
        "Student: " + studentName;

    document.getElementById("finalScore").innerText =
        score + " / " + currentPaper.length;

    document.getElementById("scoreDetails").innerText =
        "You answered " +
        score +
        " questions correctly out of " +
        currentPaper.length +
        ".";


    let message = "";

    if (score < 10) {

        message =
            "You will practice more, good luck for further exam! 😊";

    } else if (score >= 19) {

        message =
            "Excellent! Keep it up! 🏆🌟";

    } else {

        message =
            "NICE BUT TRY TO SCORE 20! 👍";
    }

    document.getElementById("scoreMessage").innerText =
        message;
}


/* =====================================================
   REVIEW EXAM
===================================================== */

function showReview() {

    showPage("reviewPage");

    const container =
        document.getElementById("reviewContainer");

    container.innerHTML = "";

    currentPaper.forEach((question, index) => {

        const selected =
            userAnswers[index];

        const item =
            document.createElement("div");

        item.className =
            "review-item";


        let selectedText =
            selected === null
            ? "Not Answered"
            : question.options[selected];


        let correctText =
            question.options[question.answer];


        if (selected === question.answer) {

            item.style.borderLeft =
                "5px solid #198754";

            item.innerHTML =

                "<h5>" +
                (index + 1) +
                ". " +
                question.question +
                "</h5>" +

                '<p class="text-success">' +
                "✅ Correct" +
                "</p>" +

                "<p><strong>Your Answer:</strong> " +
                selectedText +
                "</p>";

        } else {

            item.innerHTML =

                "<h5>" +
                (index + 1) +
                ". " +
                question.question +
                "</h5>" +

                '<p class="text-danger">' +
                "❌ Wrong Answer" +
                "</p>" +

                "<p><strong>Your Answer:</strong> " +
                selectedText +
                "</p>" +

                '<p class="text-success">' +
                "<strong>Correct Answer:</strong> " +
                correctText +
                "</p>";
        }

        container.appendChild(item);

    });
}

function showAdmin() {

function addQuestion() {

    const paper =
        document.getElementById("adminPaper").value;

    const question =
        document.getElementById("newQuestion")
        .value.trim();

    const options = [

        document.getElementById("option1").value.trim(),

        document.getElementById("option2").value.trim(),

        document.getElementById("option3").value.trim(),

        document.getElementById("option4").value.trim()

    ];

    const answer =
        parseInt(
            document.getElementById("correctOption").value
        );


    if (
        question === "" ||
        options.some(option => option === "")
    ) {

        alert("Please fill all fields.");

        return;
    }


    quizData[paper].push({

        question: question,

        options: options,

        answer: answer

    });


    document.getElementById("adminMessage").innerHTML =

        '<div class="alert alert-success">' +

        "✅ Question added successfully!" +

        "<br>" +

        "Total questions in this paper: " +

        quizData[paper].length +

        "</div>";


    document.getElementById("newQuestion").value = "";

    document.getElementById("option1").value = "";

    document.getElementById("option2").value = "";

    document.getElementById("option3").value = "";

    document.getElementById("option4").value = "";

}
